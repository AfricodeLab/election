spring.application.name=electionbackend

# Serialize Java 8+ date/time types (Instant, LocalDateTime, etc.) as ISO-8601 strings,
# NOT as epoch-second numbers. Without this, Instant fields arrive on the frontend
# as plain numbers (e.g. 1776268800) which new Date() treats as milliseconds → year 1970.
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-date-timestamps-as-nanoseconds=false

server.port=8085

# ── Tomcat thread pool ────────────────────────────────────────────────────────
# Default is 200 threads × 512 KB stack = ~100 MB committed native memory at idle.
# 20 max threads is ample for a REST API behind a load balancer on a single dyno.
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=5

# ── Lazy bean initialisation ──────────────────────────────────────────────────
# All Spring beans are created on first use rather than at startup.
# At idle (zero requests) the majority of beans are never instantiated,
# cutting startup memory by 30-50% on a context this large.
# First-request latency increases slightly (~50ms) as beans warm up.
spring.main.lazy-initialization=true

# Base URL used for email links (verification, password reset, etc.)
# Override with the public-facing domain in production, e.g. https://app.yourdomain.com
app.base-url=${APP_BASE_URL:http://localhost:3000}

# Salt used to hash IPs and user-agents in the audit log — must be a random string in production
audit.redaction.salt=${AUDIT_REDACTION_SALT:vV@w^X{56mJaO%};p*^qWz@0O<U;*g(!chUhdd1{|Bq}

#Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# PROD: use 'validate' so Flyway owns all schema changes; 'update' is dev-only
spring.jpa.hibernate.ddl-auto=validate
# Disable open-in-view — this is a REST API, no view rendering, no reason to hold DB connections open
spring.jpa.open-in-view=false
# spring.jpa.show-sql=true  -- never enable in production (leaks query structure)
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Batch INSERT/UPDATE — groups multiple rows into a single JDBC statement.
# Reduces round-trips significantly when saving collections (candidates, votes, etc.).
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
server.servlet.session.timeout=20m

# PROD: change to INFO (DEBUG floods logs with Spring internals)
logging.level.org.springframework=INFO
# logging.level.org.hibernate.SQL=DEBUG  -- dev only
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE  -- dev only
spring.flyway.baseline-on-migrate=true
spring.modulith.events.jdbc.schema-initialization.enabled=false

# HikariCP settings — tuned for Heroku Basic dyno (~512 MB RAM).
# 45 idle connections × ~5 MB/conn was the main cause of R14 (767 MB / 149%).
# 2 idle + 5 max gives comfortable headroom for this API's traffic profile.
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

management.endpoints.jmx.exposure.include=health,info


#Mail config
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

logging.level.org.brandedhustlers=INFO
logging.level.jdbc.sqlonly=OFF
logging.pattern.console= ${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}


#Multipart file configuration
# Set the maximum allowed request size in bytes
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.profiles.active = default


#CLOUDINARY CONFIGURATION
cloudinary.cloud-name=${CLOUDINARY_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}


# PROD: set both to false or protect behind auth; true is acceptable for dev/staging only
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Prevent Springdoc autoconfigure from running even when on the classpath
spring.autoconfigure.exclude=org.springdoc.webmvc.ui.SwaggerUiConfigProperties

# Redis — set REDIS_URL to a full URI (redis:// or rediss:// for TLS).
# Aiven/Heroku Redis: rediss://default:<password>@host:port
# Local dev fallback: redis://localhost:6379
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
# ssl.enabled is derived from the rediss:// scheme; explicit flag kept for clarity.
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
# 2 s timeout — 5 min was masking connection failures; fail fast instead.
spring.data.redis.timeout=2s

# Lettuce connection pool — without this, Lettuce uses a single shared connection
# and all cache reads/writes + OTP operations serialise behind it under load.
# Requires commons-pool2 on the classpath (added to pom.xml).
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=4
spring.data.redis.lettuce.pool.max-idle=2
spring.data.redis.lettuce.pool.min-idle=1
spring.data.redis.lettuce.pool.max-wait=1000ms

# PROD: restrict to health + info only; wildcard (*) exposes /actuator/env which leaks JWT_SECRET
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

#USER SET
app.rabbitmq.host=${RABBITMQ_HOST}
app.rabbitmq.port=${RABBITMQ_PORT}
app.rabbitmq.username=${RABBITMQ_USERNAME}
app.rabbitmq.password=${RABBITMQ_PASSWORD}

# RabbitMQ STOMP relay port (must have STOMP plugin enabled: rabbitmq-plugins enable rabbitmq_stomp)
rabbitmq.stomp.port=${RABBITMQ_STOMP_PORT:61613}

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=5000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=60000

# host/port are ignored when spring.data.redis.url is set — kept only as
# documentation of the local dev defaults; do not rely on these in production.
# spring.data.redis.host=localhost
# spring.data.redis.port=6379

# Blockchain Provider Configuration
# Values: 'mock' (dev/test) | 'http' (production - points to the separate blockchain Spring Boot service)
# Set BLOCKCHAIN_PROVIDER=http in the environment when running with the real chain service.
blockchain.provider=${BLOCKCHAIN_PROVIDER:mock}
# URL of the standalone blockchain anchor service (separate Spring Boot deployment)
blockchain.anchor.service.url=${BLOCKCHAIN_ANCHOR_URL:http://localhost:8081}
blockchain.anchor.service.api-key=${FABRIC_ANCHOR_API_KEY:9a3e2c1b4d5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b}

# Completely disable OpenTelemetry and Micrometer Tracing
management.tracing.enabled=false
management.otlp.tracing.endpoint=
spring.application.admin.enabled=false

# Disable all tracing propagation
management.tracing.sampling.probability=0.0

# Logging
logging.level.org.hyperledger.fabric=WARN
logging.level.io.grpc=WARN
logging.level.io.opentelemetry=OFF
logging.level.com.brandedhustlers=INFO


vote.hash.salt=${VOTE_SALT}

# rate limiting config (critical paths)
resilience4j.ratelimiter.metrics.enabled=true
resilience4j.ratelimiter.instances.critical.register-health-indicator=true
resilience4j.ratelimiter.instances.critical.limit-for-period=5
resilience4j.ratelimiter.instances.critical.limit-refresh-period=60s
resilience4j.ratelimiter.instances.critical.timeout-duration=0s
resilience4j.ratelimiter.instances.critical.allow-health-indicator-to-fail=false
resilience4j.ratelimiter.instances.critical.subscribe-for-events=true
resilience4j.ratelimiter.instances.critical.event-consumer-buffer-size=50

#bulkhead config
resilience4j.bulkhead.metrics.enabled=true
resilience4j.bulkhead.instances.critical.max-concurrent-calls=6
resilience4j.bulkhead.instances.critical.max-wait-duration=0

# rate limiting(read heavy paths)
resilience4j.ratelimiter.instances.read_heavy.register-health-indicator=true
resilience4j.ratelimiter.instances.read_heavy.limit-for-period=5
resilience4j.ratelimiter.instances.read_heavy.limit-refresh-period=10s
resilience4j.ratelimiter.instances.read_heavy.timeout-duration=0s
resilience4j.ratelimiter.instances.read_heavy.allow-health-indicator-to-fail=false
resilience4j.ratelimiter.instances.read_heavy.subscribe-for-events=true
resilience4j.ratelimiter.instances.read_heavy.event-consumer-buffer-size=50

#bulkhead config
resilience4j.bulkhead.instances.read_heavy.max-concurrent-calls=20
resilience4j.bulkhead.instances.read_heavy.max-wait-duration=0


# rate limiting config(auth paths)
resilience4j.ratelimiter.instances.auth_paths.register-health-indicator=true
resilience4j.ratelimiter.instances.auth_paths.limit-for-period=5
resilience4j.ratelimiter.instances.auth_paths.limit-refresh-period=60s
resilience4j.ratelimiter.instances.auth_paths.timeout-duration=0s
resilience4j.ratelimiter.instances.auth_paths.allow-health-indicator-to-fail=false
resilience4j.ratelimiter.instances.auth_paths.subscribe-for-events=true
resilience4j.ratelimiter.instances.auth_paths.event-consumer-buffer-size=50

#bulkhead config
resilience4j.bulkhead.instances.auth_paths.max-concurrent-calls=3
resilience4j.bulkhead.instances.auth_paths.max-wait-duration=0

# Circuit Breaker config (anchorService)
resilience4j.circuitbreaker.instances.anchorService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.anchorService.sliding-window-size=5
resilience4j.circuitbreaker.instances.anchorService.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.anchorService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.anchorService.automatic-transition-from-open-to-half-open-enabled=true

# Retry config (anchorService)
resilience4j.retry.instances.anchorService.max-attempts=3
resilience4j.retry.instances.anchorService.wait-duration=2s
resilience4j.retry.instances.anchorService.enable-exponential-backoff=true
resilience4j.retry.instances.anchorService.exponential-backoff-multiplier=2
resilience4j.retry.instances.anchorService.enable-randomized-wait=true
resilience4j.retry.instances.anchorService.randomized-wait-factor=0.5

server.forward-headers-strategy=framework



#RESEND CONFIGURATION
app.email.from=${EMAIL_FROM:AfricodeLab <noreply@africodelab.net>}
app.email.resend-key=${RESEND_KEY}
app.email.environment=${APP_ENVIRONMENT}
