spring.application.name=electionbackend

server.port=8085

#Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
server.servlet.session.timeout=20m
logging.level.org.springframework=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
#spring.flyway.baseline-on-migrate=true

management.endpoints.jmx.exposure.include=*


#Mail config
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

logging.level.org.brandedhustlers = debug
logging.level.jdbc.sqlonly=DEBUG
logging.pattern.console= ${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}


#Multipart file configuration
# Set the maximum allowed request size in bytes
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

spring.profiles.active = default


#CLOUDINARY CONFIGURATION
cloudinary.cloud-name=${CLOUDINARY_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}


springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.data.redis.url=${REDIS_URL}
spring.data.redis.ssl.enabled=true
spring.data.redis.timeout=5m

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

#spring.rabbitmq.host=${RABBITMQ_HOST}
#spring.rabbitmq.port=${RABBITMQ_PORT}
#spring.rabbitmq.username=${RABBITMQ_USERNAME}
#spring.rabbitmq.password=${RABBITMQ_PASSWORD}
#spring.rabbitmq.virtual-host=mescadtv
spring.rabbitmq.addresses=${RABBITMQ_URL}
spring.rabbitmq.ssl.enabled=true



spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=2
spring.rabbitmq.listener.simple.retry.initial-interval=2000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000

spring.data.redis.host=host.docker.internal
spring.data.redis.port=6379

# Existing config
fabric.mspId=Org1MSP
fabric.connectionProfile=classpath:fabric/connection-org1.json
fabric.certPath=classpath:fabric/users/User1@org1.example.com/msp/signcerts/cert.pem
fabric.keyPath=classpath:fabric/users/User1@org1.example.com/msp/keystore/priv_sk
fabric.channelName=electionchannel
fabric.chaincodeName=anchorcc
fabric.contractName=AnchorContract

# Completely disable OpenTelemetry and Micrometer Tracing
management.tracing.enabled=false
management.otlp.tracing.endpoint=
spring.application.admin.enabled=false

# Disable all tracing propagation
management.tracing.sampling.probability=0.0

# Logging
logging.level.org.hyperledger.fabric=INFO
logging.level.io.grpc=WARN
logging.level.io.opentelemetry=OFF
logging.level.com.brandedhustlers=DEBUG
